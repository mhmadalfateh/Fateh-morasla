name: FatehMessenger APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -o FatehMessenger.zip -d extracted

      - name: Locate Project
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force Java and Kotlin Target 17
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted/FatehMessenger")

          files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))

          for path in files:
              text = path.read_text()
              original = text

              text = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'(sourceCompatibility\s*=\s*)[^,\n]+',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'(targetCompatibility\s*=\s*)[^,\n]+',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'(jvmTarget\s*=\s*)["\'][^"\']+["\']',
                  r'\1"17"',
                  text
              )

              if text != original:
                  path.write_text(text)
                  print(f"Updated {path}")

          app_files = [
              p for p in files
              if p.parent.name == "app"
              and p.name in ("build.gradle", "build.gradle.kts")
          ]

          if not app_files:
              raise SystemExit("ERROR: app Gradle file not found")

          app = app_files[0]
          text = app.read_text()

          if "compileOptions" not in text:
              block = re.search(r'android\s*\{', text)
              if not block:
                  raise SystemExit("ERROR: android block not found")
              pos = block.end()
              text = text[:pos] + '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          ''' + text[pos:]
          else:
              text = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  '''compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''',
                  text,
                  count=1,
                  flags=re.S
              )

          if "kotlinOptions" not in text and app.name.endswith(".kts"):
              block = re.search(r'android\s*\{', text)
              pos = block.end()
              text = text[:pos] + '''
              kotlinOptions {
                  jvmTarget = "17"
              }
          ''' + text[pos:]

          app.write_text(text)
          print("Final app Gradle configuration:")
          print(text)
          PY

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FatehMessenger-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
