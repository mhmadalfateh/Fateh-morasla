name: FatehMessenger APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -o FatehMessenger.zip -d extracted

      - name: Locate Android project and Fix Java Version in .kts or .gradle
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP does not contain settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # استبدال أي إصدار قديم 1.8 أو VERSION_1_8 إلى 17 في جميع ملفات البناء تلقائياً
          echo "Replacing Java 1.8 with Java 17 in build files..."
          find "$PROJECT_DIR" -name "build.gradle" -o -name "build.gradle.kts" | while read -r file; do
            sed -i 's/VERSION_1_8/VERSION_17/g' "$file"
            sed -i 's/"1.8"/"17"/g' "$file"
            sed -i "s/'1.8'/'17'/g" "$file"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$file"
            sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$file"
          done

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FatehMessenger-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
