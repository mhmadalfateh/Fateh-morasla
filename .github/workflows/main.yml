name: FatehMessenger APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -o FatehMessenger.zip -d extracted

      - name: Locate Android project and Force Java 17
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP does not contain settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # البحث عن ملف build.gradle الخاص بالـ app وحقن إعدادات التوافق بداخله مباشرة
          APP_BUILD_GRADLE=$(find "$PROJECT_DIR" -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" | head -n 1)
          
          if [ -f "$APP_BUILD_GRADLE" ]; then
            echo "Injecting Java 17 compatibility into $APP_BUILD_GRADLE"
            echo "" >> "$APP_BUILD_GRADLE"
            echo "android {" >> "$APP_BUILD_GRADLE"
            echo "    compileOptions {" >> "$APP_BUILD_GRADLE"
            echo "        sourceCompatibility JavaVersion.VERSION_17" >> "$APP_BUILD_GRADLE"
            echo "        targetCompatibility JavaVersion.VERSION_17" >> "$APP_BUILD_GRADLE"
            echo "    }" >> "$APP_BUILD_GRADLE"
            echo "    kotlinOptions {" >> "$APP_BUILD_GRADLE"
            echo "        jvmTarget = '17'" >> "$APP_BUILD_GRADLE"
            echo "    }" >> "$APP_BUILD_GRADLE"
            echo "}" >> "$APP_BUILD_GRADLE"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FatehMessenger-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
